# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Restrict hooks to the stages that pass files we own. Without this, hooks also run
# at the `commit-msg` stage against `COMMIT_EDITMSG`, which lives outside the working
# tree in a git worktree and so trips the filename checks.
default_stages = [
  "pre-commit",
  "pre-push"
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=400"] },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  {
    # Only at pre-commit: at commit-msg this hook sees COMMIT_EDITMSG, whose
    # path from a worktree starts with "..", which it rejects as a trailing dot.
    id = "check-illegal-windows-names",
    stages = ["pre-commit"]
  },
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-xml" },
  { id = "check-yaml" },
  { id = "destroyed-symlinks" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "file-contents-sorter" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending" },
  {
    id = "pretty-format-json",
    args = ["--autofix"]
  },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  {
    id = "gitleaks",
    args = [
      "--verbose",
      "--redact",
      "--staged"
    ],
    stages = ["pre-commit"]
  }
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.1"
hooks = [
  { id = "typos" }
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
hooks = [
  {
    id = "yamllint",
    args = [
      "--format",
      "parsable",
      "--strict"
    ]
  }
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.64"
hooks = [
  {
    id = "rumdl",
    args = ["--fix"]
  },
  { id = "rumdl-fmt" }
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
  { id = "actionlint" }
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"
hooks = [
  { id = "shellcheck" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "uv-run-ty",
    name = "uv-run-ty",
    language = "system",
    types = ["python"],
    entry = "bash -c 'uv run --all-packages ty check'",
    pass_filenames = false
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "uv-run-pytest",
    name = "uv-run-pytest",
    language = "system",
    types = ["python"],
    entry = "bash -c 'uv run --all-packages pytest -vv'",
    pass_filenames = false
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "uv-run-ruff-check",
    name = "uv-run-ruff-check",
    language = "system",
    types_or = [
      "python",
      "pyi"
    ],
    entry = "bash -c 'uv run ruff check --fix'",
    pass_filenames = false
  },
  {
    id = "uv-run-ruff-format",
    name = "uv-run-ruff-format",
    language = "system",
    types_or = [
      "python",
      "pyi"
    ],
    entry = "bash -c 'uv run ruff format'",
    pass_filenames = false
  }
]
